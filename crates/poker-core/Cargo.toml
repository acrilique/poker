[package]
name = "poker-core"
version = "0.1.0"
edition = "2024"
description = "Shared poker engine: card evaluation, hand ranking, and game logic"
license = "MIT"

[dependencies]
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
# Compiles `test_util` (card/board/state fixtures) into the lib so benches and
# examples can reuse the unit-test helpers. On by default; harmless in
# production builds (a few small pub fns).
default = ["test-util"]
test-util = []

[[bench]]
name = "poker_bench"
harness = false

[lints]
workspace = true
