[package]
name = "poker-core"
version = "0.1.0"
edition = "2024"
description = "Shared poker engine: card evaluation, hand ranking, and game logic"
license = "MIT"

[dependencies]
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "poker_bench"
harness = false

[lints]
workspace = true
