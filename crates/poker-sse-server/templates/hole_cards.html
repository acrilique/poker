<div id="hole-cards" class="hole-cards">
  <div class="hole-cards-inner">
    <div class="hole-card-row">
      {% if let Some(cards) = cards %}
        {% for card in cards %}
        <div class="card {% if card.red %}suit-red{% else %}suit-black{% endif %}"><span>{{ card.label }}</span></div>
        {% endfor %}
      {% else %}
        <div class="card-back"><span>♠</span></div>
        <div class="card-back"><span>♠</span></div>
      {% endif %}
    </div>
    {% if let Some(rank) = hand_rank %}
    <div class="hand-rank">{{ rank }}</div>
    {% endif %}
  </div>
</div>
