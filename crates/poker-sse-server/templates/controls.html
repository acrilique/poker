{% if !game_started %}
<div id="controls" class="lobby-panel">
  <div class="room-chip">Room: <span class="select-all">{{ room_id }}</span></div>
  {% if host.is_host %}
  <button class="btn btn-primary btn-block" data-on:click="el.classList.add('loading'); @post('/poker/action/start')">Start Game</button>
  <details class="host-settings">
    <summary>Edit settings</summary>
    <div class="host-inputs">
      <label class="field">
        <span>Initial stack</span>
        <input type="number" min="1" value="{{ settings.stack_bbs }}" data-bind:stackbbs>
        <small>BBs per player</small>
      </label>
      <label class="field">
        <span>Blind interval</span>
        <input type="number" min="0" value="{{ settings.blind_mins }}" data-bind:blindmins>
        <small>Minutes</small>
      </label>
      <label class="field">
        <span>Blind rise</span>
        <input type="number" min="0" value="{{ settings.blind_pct }}" data-bind:blindpct>
        <small>Percent</small>
      </label>
      <button class="btn btn-elevated btn-block" data-on:click="el.classList.add('loading'); @post('/poker/action/update-settings')">Save settings</button>
    </div>
  </details>
  {% else %}
  <p class="waiting-text">Waiting for the host to start…</p>
  {% endif %}
  <button class="btn btn-muted btn-block" data-on:click="pokerExit()">Exit Game</button>
</div>
{% else %}
<div id="controls" class="controls-panel">
  {% if host.is_host %}
  <details class="host-settings">
    <summary>Edit settings</summary>
    <div class="host-inputs">
      <label class="field">
        <span>Blind interval</span>
        <input type="number" min="0" value="{{ settings.blind_mins }}" data-bind:blindmins>
        <small>Minutes</small>
      </label>
      <label class="field">
        <span>Blind rise</span>
        <input type="number" min="0" value="{{ settings.blind_pct }}" data-bind:blindpct>
        <small>Percent</small>
      </label>
      <button class="btn btn-block {% if host.allow_late_entry %}btn-accent-soft{% else %}btn-elevated{% endif %}" data-on:click="el.classList.add('loading'); @post('/poker/action/toggle-late-entry')">
        Late Entry: {% if host.allow_late_entry %}ON{% else %}OFF{% endif %}
      </button>
      <button class="btn btn-elevated btn-block" data-on:click="el.classList.add('loading'); @post('/poker/action/update-settings')">Save settings</button>
    </div>
  </details>
  {% endif %}
  {% if sitting_out %}
  <button class="btn btn-primary btn-block" data-on:click="el.classList.add('loading'); @post('/poker/action/sitin')">Sit In</button>
  {% endif %}
  <button class="btn btn-muted btn-block" data-on:click="pokerExit()">Exit Game</button>
</div>
{% endif %}
