name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update Apt
        run: sudo apt update

      - name: Install dependencies
        # libxdo-dev: required to link libxdo (pulled in on Linux by muda -> libxdo -> libxdo-sys)
        run: sudo apt install libwebkit2gtk-4.1-dev libxdo-dev

      - name: Print Rust version
        run: rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        run: cargo test --workspace
